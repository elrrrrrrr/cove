name: EasyReader
options:
  bundleIdPrefix: com.elr.easyreader
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  swift: "6.0"
  generateEmptyDirectories: true

packages:
  Yams:
    url: https://github.com/jpsim/Yams
    from: 6.2.2
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    from: 3.0.0
  ZipFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

schemes:
  EasyReader:
    build:
      targets:
        EasyReader: all
        EasyReaderTests: [test]
    run:
      config: Release
    test:
      targets:
        - EasyReaderTests
        - EasyReaderUITests
    profile:
      config: Release
    archive:
      config: Release

targets:
  EasyReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/EasyReaderUITests
    dependencies:
      - target: EasyReader
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  EasyReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/EasyReaderTests
      - path: Tests/Fixtures/Sites
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/Audio
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/SiteRegressions
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Bundle private regression snapshots for tests
        script: '"${SRCROOT}/../scripts/bundle-site-tests.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - target: EasyReader
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  EasyReader:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/EasyReader
        excludes:
          - "**/*.md"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/EasyReader/Features/WebReader/BlockerRules.json
        buildPhase: resources
    preBuildScripts:
      - name: Bundle local site definitions
        script: '"${SRCROOT}/../scripts/bundle-sites.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../scripts/bundle-sites.sh"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Sites/.staged"
    info:
      path: Resources/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.cove.site
            UTTypeDescription: Cove Site Definition
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [site]
              public.mime-type: [application/x-cove-site]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cove Site Definition
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.cove.site]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDisplayName: Cove
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: "用于连接局域网内的 NAS 设备（SMB 协议）"
        NSBonjourServices:
          - "_smb._tcp"
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
    entitlements:
      path: Resources/EasyReader.entitlements
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: ESU3QK7224
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Yams
      - package: AMSMB2
        embed: true
      - package: ZipFoundation
        product: ZIPFoundation
