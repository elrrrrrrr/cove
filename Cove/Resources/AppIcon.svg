<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="1024" fill="#0F172A"/>

  <!-- Ambient glow -->
  <circle cx="440" cy="512" r="380" fill="rgba(99,102,241,0.06)"/>

  <!-- Large "C" — gradient arc with glow, opening to the right -->
  <path d="M610,230 A320,320 0 1,0 610,794"
        fill="none" stroke="url(#arc)" stroke-width="82" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- "ove" — light weight, nestled at the C opening -->
  <text x="615" y="562"
        font-family="SF Pro Rounded, Nunito, Quicksand, Helvetica Neue, sans-serif"
        font-size="175" font-weight="300" fill="rgba(255,255,255,0.88)"
        letter-spacing="5">ove</text>
</svg>
